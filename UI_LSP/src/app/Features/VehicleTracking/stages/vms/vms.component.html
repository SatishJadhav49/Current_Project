<div class="bg-white rounded-lg shadow-md p-6 mb-4">
  <!-- Stage header -->
  <div class="flex items-center justify-between mb-4 pb-3 border-b">
    <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2">
      <span class="inline-flex items-center justify-center w-8 h-8 rounded-full border-2 border-blue-600 text-base font-bold leading-none">
        🖥️
      </span>
      VMS
    </h3>
    <span class="text-xs text-gray-500">
      Vehicle: <span class="font-semibold text-gray-700">{{ vehicle?.VIN_No }}</span>
      <span *ngIf="logDate" class="ml-3 pl-3 border-l border-gray-300">
        Saved: <span class="font-semibold text-gray-700">{{ logDate | date:'medium' }}</span>
      </span>
    </span>
  </div>

  <!-- Auditor + Status (single row on md+) -->
  <fieldset [disabled]="locked" class="flex flex-col md:flex-row md:items-end gap-4 mb-6 disabled:opacity-60">
    <div class="w-full md:w-96">
      <label class="block text-sm font-medium text-gray-700 mb-1">
        VMS Auditor <span class="text-red-500">*</span>
      </label>
      <select
        name="auditor"
        [(ngModel)]="selectedAuditorId"
        (ngModelChange)="onAuditorChange()"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
      >
        <option [ngValue]="0">-- Select Auditor --</option>
        <option *ngFor="let a of auditors" [ngValue]="a.Auditor_ID">
          {{ a.Auditor_Name }}
        </option>
      </select>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Status <span class="text-red-500">*</span>
      </label>
      <div class="flex gap-2">
        <button
          type="button"
          (click)="pickStatus('OK')"
          class="px-5 py-2 rounded-md font-semibold border-2 transition-colors whitespace-nowrap"
          [ngClass]="status === 'OK'
            ? 'bg-emerald-600 hover:bg-emerald-700 text-white border-emerald-600'
            : 'bg-white hover:bg-emerald-50 text-emerald-700 border-emerald-300'"
        >
          ✓ OK
        </button>
        <button
          type="button"
          (click)="pickStatus('NOK')"
          class="px-5 py-2 rounded-md font-semibold border-2 transition-colors whitespace-nowrap"
          [ngClass]="status === 'NOK'
            ? 'bg-red-600 hover:bg-red-700 text-white border-red-600'
            : 'bg-white hover:bg-red-50 text-red-700 border-red-300'"
        >
          ✗ Not OK
        </button>
      </div>
    </div>
  </fieldset>

  <!-- Files / Images -->
  <div class="border-t pt-4 mb-6">
    <div class="flex items-center justify-between mb-3">
      <h4 class="text-base font-semibold text-gray-800 border-l-4 border-orange-500 pl-2">
        Images / Files
      </h4>
      <span class="text-xs text-gray-500">
        {{ documents.length }} / {{ MAX_FILES }}
      </span>
    </div>

    <!-- Drop zone -->
    <div
      *ngIf="!locked"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)"
      (drop)="onDrop($event)"
      class="border-2 border-dashed rounded-md p-4 mb-4 transition-colors"
      [ngClass]="isDragging
        ? 'border-blue-500 bg-blue-50'
        : 'border-gray-300 bg-gray-50'"
    >
      <div class="flex flex-col sm:flex-row items-center gap-3">
        <input
          #fileInput
          type="file"
          multiple
          accept="image/*,.pdf,.doc,.docx"
          (change)="onFilesChosen($event)"
          [disabled]="documents.length >= MAX_FILES || uploading"
          class="block flex-1 text-sm text-gray-700 file:mr-3 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-medium file:bg-blue-600 file:text-white hover:file:bg-blue-700 file:cursor-pointer disabled:opacity-50"
        />
        <span *ngIf="uploading" class="text-sm text-blue-700 whitespace-nowrap">
          Uploading…
        </span>
      </div>

      <p class="text-xs text-gray-500 mt-2 text-center" *ngIf="!isDragging">
        Drag &amp; drop files here, paste with <kbd class="px-1 py-0.5 border border-gray-300 rounded bg-white">Ctrl/⌘&nbsp;+&nbsp;V</kbd>,
        or use the picker above.
      </p>
      <p class="text-sm text-blue-700 font-semibold mt-2 text-center" *ngIf="isDragging">
        Drop files to upload
      </p>
    </div>

    <!-- Thumbnail / file strip -->
    <div *ngIf="documents.length" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-3">
      <div
        *ngFor="let f of documents; let i = index"
        class="relative border border-gray-200 rounded-md bg-gray-50 overflow-hidden"
      >
        <!-- Image preview -->
        <a
          *ngIf="isImage(f); else fileLink"
          [href]="downloadUrlOf(f)"
          target="_blank"
          rel="noopener"
          class="block aspect-square bg-gray-100"
        >
          <img
            [src]="downloadUrlOf(f)"
            [alt]="displayNameOf(f)"
            class="w-full h-full object-cover"
          />
        </a>
        <ng-template #fileLink>
          <a
            [href]="downloadUrlOf(f)"
            target="_blank"
            rel="noopener"
            class="flex flex-col items-center justify-center aspect-square bg-gray-100 text-gray-500 hover:bg-gray-200"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h7l5 5v11a2 2 0 01-2 2z" />
            </svg>
            <span class="text-[10px] mt-1 px-1">File</span>
          </a>
        </ng-template>

        <div class="px-2 py-1 text-[11px] text-gray-700 truncate" [title]="displayNameOf(f)">
          {{ displayNameOf(f) }}
        </div>

        <!-- Delete -->
        <button
          *ngIf="!locked"
          type="button"
          (click)="removeFile(i)"
          class="absolute top-1 right-1 bg-white rounded-full p-1 text-red-600 hover:bg-red-100 transition-colors shadow"
          title="Remove"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
        </button>
      </div>
    </div>

    <p *ngIf="!documents.length" class="text-xs text-gray-400 italic">
      No files attached yet.
    </p>
  </div>

  <!-- Save -->
  <div *ngIf="!locked" class="flex justify-end pt-4 border-t">
    <button
      type="button"
      (click)="save()"
      [disabled]="!canSave()"
      class="px-6 py-3 bg-green-600 hover:bg-green-700 disabled:bg-gray-300 disabled:cursor-not-allowed text-white rounded-md font-semibold"
    >
      {{ saving ? 'Saving…' : '✓ Save VMS' }}
    </button>
  </div>
</div>
