    <!-- File Upload -->
    <div class="mb-4">
      <label class="block text-lg font-medium text-gray-700 mt-5 ml-1 ">Upload Excel File</label>
      <p class="text-sm text-gray-500 mt-3">⚠️ Upload File should not be more than <strong>10MB</strong>.</p>
      <input type="file" (change)="onFileChange($event)" accept=".xlsx, .xls"
        class="block w-full text-sm text-gray-900
          file:mr-4 file:py-2 file:px-4
          file:rounded file:border-0
          file:text-sm file:font-semibold
          file:bg-blue-50 file:text-blue-700
          hover:file:bg-blue-100 mt-3" />

      <div class="h-5 mt-1">
      @if (fileError) {
        <p class="text-red-600 text-sm mt-1">{{ fileError }}</p>
      }
      </div>
    </div>

    <!-- Buttons -->
    <div class="flex justify-end space-x-3 mt-7">
      <button (click)="onCancel()" class="px-4 py-2 bg-gray-200 text-gray-800 rounded hover:bg-gray-300">
        Cancel
      </button>
      <button (click)="onUpload()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
        Upload
      </button>
    </div>
